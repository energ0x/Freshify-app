services:
  setup:
    image: python:3.12-slim
    container_name: freshify_setup
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: python setup.py --docker
    profiles:
      - setup

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshify_seed
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: python seed_premium_user.py
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: freshify_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshify_backend
    restart: always
    env_file: .env
    environment:
      # Override DATABASE_URL so the backend reaches the 'db' service inside Docker,
      # not localhost:5435 which is the local-dev address in .env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
