version: '3.8'

services:
  setup:
    image: python:3.12-slim
    container_name: freshify_setup
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: python setup.py --docker
    profiles:
      - setup

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshify_seed
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: python seed_premium_user.py
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: freshify_db
    restart: always
    environment:
      POSTGRES_USER: freshify_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: freshify_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: freshify_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@freshify.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
